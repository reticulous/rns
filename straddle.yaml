# rns — Reticulum (RNS) protocol core for spangap.
#
# Pure protocol logic: identity, destinations, path table, transport
# state machine, links, resources. Zero networking/radio dependencies —
# interface straddles (iface-tcp/-auto/-espnow/-lora) plug their
# interfaces in via the RNSD_PORT_IFACE ITS surface.
#
# Vendors the µReticulum hard fork (esp-idf/components/microreticulum/)
# and bzip2 1.0.8 (esp-idf/components/bzip2/) as nested sub-components.
# Consumers (hw-lilygo-tdeck and any other buildable straddle) pick these
# up via the staging/components/*/components/ glob in their top-level
# CMakeLists.txt.
#
# Browser half holds shared RNS UI (RNS settings panel, Nodes window,
# Announces window, RNS Pinia state). LXMF/Nomad/maps are separate
# straddles that contribute their own panels.
schema_version: 1
name: reticulous/rns
prefix: rns
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
# spangap-core is implicit (the empty-prefix platform foundation) — not listed.

# Build settings this straddle's vendored µReticulum fork needs. They ride in
# via the sdkconfig fragment (layered above the platform defaults), so they
# only apply when rns is actually staged — no consumer board has to know them.
kconfig:
  # microReticulum uses C++ exceptions extensively — every error path in
  # Identity, Packet, Cryptography, Persistence raises std::invalid_argument /
  # std::runtime_error. The platform default disables exceptions for code size
  # (CONFIG_COMPILER_CXX_EXCEPTIONS=n); re-enable here. Cost ~30 KB + libstdc++
  # unwinder tables.
  #
  # The emergency pool must be non-zero. __cxa_throw allocates the per-thread
  # exception globals; with no pool it cannot, and eh_globals.cc calls
  # std::terminate() directly — so every std::bad_alloc aborts the device and
  # each `catch (const std::bad_alloc&)` in the tree is unreachable. 2048 B is
  # enough for the globals plus one in-flight exception object.
  - CONFIG_COMPILER_CXX_EXCEPTIONS=y
  - CONFIG_COMPILER_CXX_EXCEPTIONS_EMG_POOL_SIZE=2048
  # mbedTLS HKDF — used by µR's Cryptography/HKDF.cpp (key derivation for
  # Fernet, IFAC, Identity prove/verify). Off by default in IDF.
  - CONFIG_MBEDTLS_HKDF_C=y
# Boot-registered Service: RnsdService::onInit() runs in the straddle band,
# after the platform band (so storage/LCD are up). The interface straddles
# (rns_tcp/rns_auto/rns_lora/rns_espnow, dirs iface-*) all
# `requires: reticulous/rns`, so the dependency-topo order brings rnsd up — and
# its ITS port surface with it — before they self-register their interfaces. No
# explicit ordering needed.
services:
  - { class: RnsdService, header: rnsd.h }
  # The distributed network graph. A client of rnsd (RNS_PHASE_CLIENT), so it
  # joins the RNS lifecycle rather than the boot band: it publishes its own
  # record as an announce, gossips the community's, and resolves the union into
  # the netgraph.* rows the browser and the display read. Its settings are
  # seeded in code (storageDefaultTree) rather than declared here — nothing
  # about it belongs on a settings pane.
  - { class: NetgraphService, header: netgraph.h }
  # Interface-class pills in the shell status bar (`L3` — three peers on LoRa).
  # The renderer is shared, driven by the rns.pill.* keys each interface
  # straddle publishes, so it lives here rather than four times over. when:-gated
  # on spangap-lcd — the whole class is under conditional/spangap-lcd/, so
  # without a display neither the trampoline nor the class compiles.
  - { class: RnsdPillsService, header: rnsd_pills.h, when: spangap/spangap-lcd }

# Browser-side UI registration (parallel to init: above) — auto-wired into
# the buildable SPA via straddles.gen.ts; no web-interface edit needed.
browser_register:
  - call: registerRnsd
    module: modules/rnsd

# Declarative settings: both surfaces + storage defaults generated from this
# block. path.max/path.ttl are defaultless here:
# rnsd.cpp applies the working defaults (100 entries / 86400 s) via its
# NOW_AND_ON_CHANGE fallback, so the sliders must not duplicate them. "Enable" is
# read once at boot — changing it needs a reboot (see rns/INTERNALS.md §6). The
# non-setting rnsd defaults stay in rnsd.cpp.
settings:
  # rnsd owns the Reticulum menu and the Interfaces node under it: it names
  # both, and every interface straddle states only the bare `id: interfaces`
  # and its own level-2 heading.
  - at:
      - { id: reticulum }
      - { id: interfaces, label: "Interfaces", order: 1 }
    order: 1
    rows:
      - title: "Reticulum interfaces"
  - at:
      - { id: reticulum }
    rows:
      - title: "Reticulum"
      - value:  { label: "Identity", key: "rnsd.identity_hash", copyable: true }
      - switch: { label: "Enable Reticulum", key: "s.rnsd.enable", default: 1 }
      - switch: { label: "Transport node", key: "s.rnsd.transport_enabled", default: 0 }
      - caption: "A transport node forwards packets for others."
      # No announce interval here. How often this node says who it is belongs
      # to each interface — see any interface's own pane — because only the
      # interface knows what airtime costs on its medium.
      - integer: { label: "Signal-report probes", key: "s.rnsd.rx_report_probes", min: 0, max: 10, default: 3 }
      - caption: "Extra proofs offering our rx signal to a new direct peer (0 = off)."
      - section: "Path table"
      - integer: { label: "Capacity", key: "s.rnsd.path.max", min: 64, max: 512 }
      - integer: { label: "TTL", unit: "s", key: "s.rnsd.path.ttl", min: 3600, max: 604800 }

  # NetGraph sits under Reticulum beside Interfaces: it is a view of the mesh
  # and a way of asking other nodes about theirs, so it belongs where the mesh
  # is configured rather than in a menu of its own.
  - at:
      - { id: reticulum }
      - { id: netgraph, label: "NetGraph", order: 2 }
    order: 2
    rows:
      - title: "NetGraph"
      - switch: { label: "Enable NetGraph", key: "s.netgraph.enable", default: 1 }
      - caption: "Draws the mesh from this node's own routing and interface
                  state. The picture costs no traffic; only a crawl does."

      - section: "Community"
      - caption: "A community is one name and one passphrase, shared by every
                  node in it. Both together derive a keypair that admits any
                  node holding them — nothing is exchanged and there is nothing
                  to configure per peer. Anyone with the passphrase can query
                  every node that trusts it, so treat it as the community's
                  access credential rather than as a network name."
      - text:   { label: "Community name", key: "s.netgraph.community",
                  placeholder: "unset — no community" }
      - text:   { label: "Passphrase", key: "s.netgraph.passphrase", secret: true }
      # Only once a key has actually been derived. Deriving takes a few seconds
      # on the slowest boards, so an operator who has just typed a passphrase is
      # watching for exactly this row to appear.
      - when_key: "netgraph.community.id"
        value: { label: "Community identity", key: "netgraph.community.id",
                 copyable: true }
      - when_key: "netgraph.community.id"
        caption: "Ask remote nodes that do not have NetGraph to enable network
                  management and to allow access to this identity to make them
                  answer queries by this community."

      - section: "Serving"
      - switch: { label: "Answer remote queries", key: "s.netgraph.serve", default: 1 }
      - caption: "Answers /path and /status on the stock Reticulum management
                  address, so `rnstatus -R` from an unmodified installation
                  works. Only the community and the identities below may ask;
                  an unidentified request is refused."
      - list:
          label: "Additional access"
          caption: "Identities allowed to query this node besides the
                    community — for a node outside it whose operator you know.
                    Same form as Reticulum's own remote_management_allowed, so
                    a line copies straight across either way."
          key: s.netgraph.allow
          id: id
          item: "{hash}"
          empty: "No individual identities granted."
          cmd: netgraph.allow
          add:
            - label: "Allow an identity"
              form:
                title: "Allow an identity"
                submit: "Allow"
                fields:
                  - text: { label: "Identity hash", field: hash,
                            placeholder: "32 hexadecimal characters" }
          remove: { confirm: "Stop allowing {hash}?" }

      - section: "Crawling"
      - caption: "A crawl asks each node in range for its own routes and
                  interfaces, one link at a time. It runs when you press the
                  button in the NetGraph window and at no other time — it
                  spends somebody else's airtime."
      - integer: { label: "Radius", unit: "hops", key: "s.netgraph.radius", min: 1, max: 4, default: 2 }
      - integer: { label: "Give up after", unit: "s", key: "s.netgraph.crawl_timeout_s", min: 5, max: 120, default: 20 }
      - integer: { label: "Forget unheard peers after", unit: "h", key: "s.netgraph.heard_h", min: 1, max: 48, default: 3 }
      - caption: "A peer nothing has heard from for this long leaves the
                  drawing. Lines are removed rather than dimmed: everything on
                  the picture is current."
